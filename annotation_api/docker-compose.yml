name: pyronear
services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - 5432
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=dummy_pg_user
      - POSTGRES_PASSWORD=dummy_pg_pwd
      - POSTGRES_DB=dummy_pg_db
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U dummy_pg_user -d dummy_pg_db'"]
      interval: 10s
      timeout: 20s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - 4566:4566
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:4566
      - RUSTFS_ACCESS_KEY=fake
      - RUSTFS_SECRET_KEY=fakefake
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health/ready"]
      interval: 10s
      timeout: 20s
      retries: 10

  # One-shot bucket bootstrap: the API only checks its bucket, it never creates it.
  rustfs-init:
    image: amazon/aws-cli:2.37.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=fake
      - AWS_SECRET_ACCESS_KEY=fakefake
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "aws --endpoint-url http://rustfs:4566 s3api head-bucket --bucket annotation-api
      || aws --endpoint-url http://rustfs:4566 s3 mb s3://annotation-api"

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "5050:5050"
    environment:
      - POSTGRES_URL=postgresql+asyncpg://dummy_pg_user:dummy_pg_pwd@db/dummy_pg_db
      - S3_ENDPOINT_URL=http://rustfs:4566
      - S3_ACCESS_KEY=fake
      - S3_SECRET_KEY=fakefake
      - S3_REGION=us-east-1
      - S3_PROXY_URL=http://localhost:4566
      # Authentication
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=admin12345
      - JWT_SECRET=your_jwt_secret_key_change_in_production_please
      - ACCESS_TOKEN_EXPIRE_HOURS=24
    restart: always
    command: "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 5050 --proxy-headers'"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:5050/status"]
      interval: 10s
      timeout: 20s
      retries: 10

volumes:
  postgres_data:
  rustfs_data:
