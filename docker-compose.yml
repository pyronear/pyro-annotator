name: pyro-annotator
services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # The API runs several worker processes, each with its own connection
    # pool, so the default max_connections=100 is tight. Keep this in step with
    # POSTGRES_MAX_CONNECTIONS on annotation_api, which is what
    # tests/test_pool_sizing.py checks the budget against.
    command: postgres -c max_connections=150
    environment:
      - POSTGRES_USER=dummy_pg_user
      - POSTGRES_PASSWORD=dummy_pg_pwd
      - POSTGRES_DB=dummy_pg_db
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U dummy_pg_user -d dummy_pg_db'"]
      interval: 10s
      timeout: 20s
      retries: 10

  # RustFS S3 service (S3 API kept on 4566 so existing env/scripts/presigned URLs keep working)
  rustfs:
    image: rustfs/rustfs:1.0.0
    ports:
      - "4566:4566"
      - "9001:9001"
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:4566
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_ACCESS_KEY=fake
      - RUSTFS_SECRET_KEY=fakefake
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health/ready"]
      interval: 10s
      timeout: 20s
      retries: 10

  # One-shot bucket bootstrap: the API only checks its bucket, it never creates it.
  # Idempotent: re-runs on every `up` and exits 0 if the bucket exists.
  rustfs-init:
    image: amazon/aws-cli:2.37.0
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=fake
      - AWS_SECRET_ACCESS_KEY=fakefake
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "aws --endpoint-url http://rustfs:4566 s3api head-bucket --bucket annotation-api
      || aws --endpoint-url http://rustfs:4566 s3 mb s3://annotation-api"

  # Annotation API backend
  annotation_api:
    build:
      context: ./annotation_api
      dockerfile: ./Dockerfile
      tags:
        - "pyronear/annotation-api:latest"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "5050:5050"
    environment:
      - SUPPORT_EMAIL=contact@pyronear.org
      # DB
      - POSTGRES_URL=postgresql+asyncpg://dummy_pg_user:dummy_pg_pwd@postgres/dummy_pg_db
      # S3
      - S3_ENDPOINT_URL=http://rustfs:4566
      - S3_ACCESS_KEY=fake
      - S3_SECRET_KEY=fakefake
      - S3_REGION=us-east-1
      - S3_PROXY_URL=http://localhost:4566
      # Authentication
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=admin12345
      - JWT_SECRET=your_jwt_secret_key_change_in_production_please
      - ACCESS_TOKEN_EXPIRE_HOURS=24
      # Serving / pool sizing. UVICORN_WORKERS is read both by the command
      # below and by app.core.config, so the process count and the connection
      # budget can never drift apart.
      # Budget: 2 workers x (10 + 10) = 40, plus the queue worker's 20, against
      # max_connections=150 (less 3 reserved). See src/tests/test_pool_sizing.py.
      #
      # Deliberately 2, not one-per-core: each worker is a full Python process
      # with the app loaded, and the host is memory-constrained. Two removes the
      # single-process serialization, which is the point. Raise it here (and
      # POSTGRES_MAX_CONNECTIONS with it) once memory headroom is known.
      - UVICORN_WORKERS=2
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=10
      - POSTGRES_MAX_CONNECTIONS=150
    restart: unless-stopped
    # $$ escapes Compose interpolation so the shell expands it in-container.
    command: "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 5050 --proxy-headers --workers $${UVICORN_WORKERS:-2}'"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:5050/status"]
      interval: 10s
      timeout: 20s
      retries: 10

  # Auto-annotate queue worker (procrastinate)
  worker:
    build:
      context: ./annotation_api
      dockerfile: ./Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      annotation_api:
        condition: service_healthy
    environment:
      # DB
      - POSTGRES_URL=postgresql+asyncpg://dummy_pg_user:dummy_pg_pwd@postgres/dummy_pg_db
      # S3
      - S3_ENDPOINT_URL=http://rustfs:4566
      - S3_ACCESS_KEY=fake
      - S3_SECRET_KEY=fakefake
      - S3_REGION=us-east-1
    restart: unless-stopped
    command: "procrastinate --app=app.worker.app worker"
    healthcheck:
      disable: true

  # Frontend React application
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_ENVIRONMENT=production
      tags:
        - "pyronear/annotation-app:latest"
    depends_on:
      annotation_api:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  rustfs_data:
