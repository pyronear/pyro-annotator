name: pyro-annotator
services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=dummy_pg_user
      - POSTGRES_PASSWORD=dummy_pg_pwd
      - POSTGRES_DB=dummy_pg_db
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U dummy_pg_user -d dummy_pg_db'"]
      interval: 10s
      timeout: 20s
      retries: 10

  # MinIO S3 service (S3 API kept on 4566 so existing env/scripts/presigned URLs keep working)
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --address ':4566' --console-address ':9001'
    ports:
      - "4566:4566"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=fake
      - MINIO_ROOT_PASSWORD=fakefake
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/minio/health/ready"]
      interval: 10s
      timeout: 20s
      retries: 10

  # One-shot bucket bootstrap (replaces the LocalStack ready.d init script).
  # Idempotent: re-runs on every `up` and exits 0 if the bucket exists.
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:4566 fake fakefake
      && mc mb --ignore-existing local/annotation-api"

  # Annotation API backend
  annotation_api:
    build:
      context: ./annotation_api
      dockerfile: ./Dockerfile
      tags:
        - "pyronear/annotation-api:latest"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "5050:5050"
    environment:
      - SUPPORT_EMAIL=contact@pyronear.org
      # DB
      - POSTGRES_URL=postgresql+asyncpg://dummy_pg_user:dummy_pg_pwd@postgres/dummy_pg_db
      # S3
      - S3_ENDPOINT_URL=http://minio:4566
      - S3_ACCESS_KEY=fake
      - S3_SECRET_KEY=fakefake
      - S3_REGION=us-east-1
      - S3_PROXY_URL=http://localhost:4566
      # Authentication
      - AUTH_USERNAME=admin
      - AUTH_PASSWORD=admin12345
      - JWT_SECRET=your_jwt_secret_key_change_in_production_please
      - ACCESS_TOKEN_EXPIRE_HOURS=24
    restart: unless-stopped
    command: "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 5050 --proxy-headers'"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:5050/status"]
      interval: 10s
      timeout: 20s
      retries: 10

  # Auto-annotate queue worker (procrastinate)
  worker:
    build:
      context: ./annotation_api
      dockerfile: ./Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      annotation_api:
        condition: service_healthy
    environment:
      # DB
      - POSTGRES_URL=postgresql+asyncpg://dummy_pg_user:dummy_pg_pwd@postgres/dummy_pg_db
      # S3
      - S3_ENDPOINT_URL=http://minio:4566
      - S3_ACCESS_KEY=fake
      - S3_SECRET_KEY=fakefake
      - S3_REGION=us-east-1
      # Auto-annotate model (baked into the image)
      - AUTOANNOTATE_MODEL_PATH=/app/models
    restart: unless-stopped
    command: "procrastinate --app=app.worker.app worker"
    healthcheck:
      disable: true

  # Frontend React application
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
        - VITE_ENVIRONMENT=production
      tags:
        - "pyronear/annotation-app:latest"
    depends_on:
      annotation_api:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  minio_data:
