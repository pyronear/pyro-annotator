name: Annotation API CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'annotation_api/**'
      - '.github/workflows/annotation-api-ci.yml'

# A new push to the same PR makes the in-flight run obsolete. This is the
# most expensive workflow we have, so superseded runs are worth cancelling.
concurrency:
  group: annotation-api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: annotation_api

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Pre-build backend image with cache
      uses: docker/build-push-action@v5
      with:
        context: annotation_api
        file: annotation_api/Dockerfile
        target: test
        tags: pyronear/annotation-api:test
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    # postgres and localstack are pulled by `docker compose up` in `make test`.
    # We used to tarball them into an actions/cache here, but this workflow only
    # runs on pull_request, so every cache it wrote was scoped to that PR's merge
    # ref and no other PR could read it - main never populated the key. It cost
    # ~70s of pull/save/upload on every run and restored only on a repeat run of
    # the same PR. Measured back-to-back from one base commit: 8m05s with these
    # steps, 6m38s without.

    - name: Run tests using make
      run: |
        # Use the pre-built image by tagging it appropriately
        docker tag pyronear/annotation-api:test pyronear/annotation-api:latest || true
        
        # Run the tests
        make test