name: push

# Same tagging logic as pyronear/pyro-api:
# - push to main      -> images tagged `latest`
# - push of a tag v*  -> images tagged with the version, leading `v` stripped
#                        (git tag v0.2.0 -> docker tag 0.2.0)
# Only version-shaped tags (vX.Y.Z, optional suffix like -rc1) trigger a build,
# so a tag such as `vlatest` cannot overwrite `latest`.
on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_LOGIN }}
  BACKEND_IMAGE_NAME: annotation-api
  FRONTEND_IMAGE_NAME: annotation-app

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PW }}

      - name: Build backend image
        run: |
          docker build \
            -f annotation_api/Dockerfile \
            annotation_api \
            -t $DOCKERHUB_USER/$BACKEND_IMAGE_NAME:$IMAGE_TAG

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            frontend \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_ENVIRONMENT=production \
            -t $DOCKERHUB_USER/$FRONTEND_IMAGE_NAME:$IMAGE_TAG

      - name: Push images to DockerHub
        run: |
          docker push $DOCKERHUB_USER/$BACKEND_IMAGE_NAME:$IMAGE_TAG
          docker push $DOCKERHUB_USER/$FRONTEND_IMAGE_NAME:$IMAGE_TAG
